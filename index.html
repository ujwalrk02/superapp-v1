<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AkiPaga</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --primary:#E9A514;
    --primary-dark:#B77800;
    --secondary:#457ABD;
    --secondary-dark:#2F5B90;
    --bg:#F7F4EC;
    --card:#FFFFFF;
    --ink-900:#10253C;
    --ink-600:#4F647A;
    --ink-400:#73839A;
    --line:#E6EAF1;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#F2EFE7;
    display:flex;
    justify-content:center;
    font-family:'Inter',sans-serif;
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }

  .device{
    width:390px;
    height:844px;
    background:var(--bg);
    border-radius:44px;
    overflow:hidden;
    position:relative;
    box-shadow:0 0 0 10px #0d0d0d,0 0 0 12px #2b2b2b;
    margin:24px;
    display:flex;
    flex-direction:column;
  }

  @media (max-width: 480px) {
    html{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;}
    body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:var(--bg);overscroll-behavior:none;position:fixed;inset:0;}
    .device{position:fixed;inset:0;width:100vw;width:100dvw;height:100vh;height:100dvh;max-width:none;max-height:none;margin:0;border-radius:0;box-shadow:none;background:var(--bg);}
  }

  @media (min-width: 481px) and (max-width: 768px) {
    body{background:var(--bg);}
    .device{width:100%;height:100vh;max-width:390px;border-radius:0;margin:0 auto;box-shadow:none;}
  }

  .launcher-body{
    flex:1;
    display:flex;
    flex-direction:column;
    overflow-y:auto;
    scrollbar-width:none;
    padding:38px 22px calc(30px + env(safe-area-inset-bottom));
  }
  .launcher-body::-webkit-scrollbar{display:none;}

  .launcher-title{
    font-family:'Manrope';
    font-weight:800;
    font-size:26px;
    line-height:1.2;
    letter-spacing:-0.3px;
  }
  .launcher-desc{
    font-size:12.5px;
    color:var(--ink-600);
    line-height:1.55;
    margin-top:10px;
    max-width:280px;
  }

  .launcher-options{
    margin-top:auto;
    padding-top:40px;
  }
  .options-label{
    font-size:10.5px;
    font-weight:700;
    color:var(--ink-400);
    text-transform:uppercase;
    letter-spacing:1.2px;
    margin-bottom:12px;
  }

  /* App option cards */
  .app-card{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--card);
    border-radius:18px;
    padding:16px;
    box-shadow:0 2px 8px rgba(16,37,60,0.05);
    border:2px solid transparent;
    cursor:pointer;
    text-decoration:none;
    color:var(--ink-900);
    margin-bottom:14px;
    transition:border-color .2s ease, transform .2s ease, box-shadow .2s ease;
  }
  .app-card:hover{border-color:var(--line); transform:translateY(-2px); box-shadow:0 6px 18px rgba(16,37,60,0.08);}
  .app-card:active{transform:none;}
  .app-card.merchant:hover{border-color:var(--primary);}
  .app-card.user:hover{border-color:var(--secondary);}

  .app-ico{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:#fff;
  }
  .app-ico svg{width:24px;height:24px;}
  .app-ico.merchant{background:linear-gradient(135deg,#F0BF46,var(--primary)); box-shadow:0 8px 16px -8px rgba(233,165,20,0.55);}
  .app-ico.user{background:linear-gradient(135deg,#5B8DCC,var(--secondary-dark)); box-shadow:0 8px 16px -8px rgba(69,122,189,0.55);}

  .app-text{flex:1;min-width:0;}
  .app-text b{
    display:block;
    font-family:'Manrope';
    font-weight:800;
    font-size:15px;
  }
  .app-text span{
    display:block;
    font-size:11px;
    color:var(--ink-600);
    line-height:1.45;
    margin-top:3px;
  }
  .app-arrow{
    color:var(--ink-400);
    flex-shrink:0;
    width:18px;
    height:18px;
  }
</style>
</head>
<body>

<div class="device">
  <div class="launcher-body">

    <div class="launcher-title">Choose your app</div>
    <div class="launcher-desc">Pick a side to open the experience you need. Tap a card to jump straight in.</div>

    <div class="launcher-options">
      <div class="options-label">Select one</div>

      <a class="app-card merchant" href="merchant.html">
        <div class="app-ico merchant">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5" />
            <path d="M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244" />
            <path d="M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05" />
          </svg>
        </div>
        <div class="app-text">
          <b>Merchant</b>
          <span>Accept QR payments, track sales, request settlements &amp; grow with capital loans.</span>
        </div>
        <svg class="app-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </a>

      <a class="app-card user" href="user.html">
        <div class="app-ico user">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1" />
            <path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4" />
          </svg>
        </div>
        <div class="app-text">
          <b>User</b>
          <span>Send money instantly, pay bills, scan QR codes and earn cashback on every spend.</span>
        </div>
        <svg class="app-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m9 18 6-6-6-6" />
        </svg>
      </a>
    </div>

  </div>
</div>

</body>
</html>
